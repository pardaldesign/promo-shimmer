<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo shimmer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@700&display=swap">
<style>
:root{--bg:#E9ECF3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16181D}}
:root[data-theme="dark"]{--bg:#16181D}
html,body{margin:0;height:100%;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px;box-sizing:border-box}
.phone{position:relative;width:375px;max-width:100%;aspect-ratio:375/812;overflow:hidden;border-radius:48px;box-shadow:0 20px 60px rgba(0,0,0,.18);background:#F3F5FB}
.stage{position:absolute;left:0;top:0;width:375px;height:812px;transform-origin:0 0}
.stage img{display:block;width:375px;height:812px}
.promo{position:absolute;left:0;top:673px;width:375px;height:29px;overflow:hidden;border-radius:20px 20px 0 0}
.cover{position:absolute;left:80px;top:1px;width:215px;height:27px;background:#F1AF12}
.label{position:absolute;left:88px;top:0;height:29px;display:flex;align-items:center;gap:9px;color:#914808;font:700 15px/1 Lato,system-ui,sans-serif;text-decoration:none}
@keyframes sh{0%{transform:translateX(-100px)}30%{transform:translateX(635px)}100%{transform:translateX(635px)}}
@keyframes pop{0%{transform:scale(1)}3%{transform:scale(1.14)}6%{transform:scale(1)}100%{transform:scale(1)}}
.sh{position:absolute;top:0;left:0;width:100px;height:100%;pointer-events:none;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.45) 50%,rgba(255,255,255,0) 100%);animation:sh 8s linear infinite}
.l{display:inline-block;white-space:pre;transform-origin:50% 70%;animation:pop 8s cubic-bezier(.4,0,.2,1) infinite}
.icon{display:block;transform-origin:50% 50%;animation:pop 8s cubic-bezier(.4,0,.2,1) infinite;animation-delay:.24s}
@media (prefers-reduced-motion: reduce){.sh,.l,.icon{animation:none}}
</style>
